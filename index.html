<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Time has moved</title>
<meta http-equiv="refresh" content="0; url=https://opentime.work/">
<link rel="canonical" href="https://opentime.work/">
<script>
  // clear the old offline copy so this address stops showing the app
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  location.replace('https://opentime.work/');
</script>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#EDF0EE;color:#1C2427}a{color:#3564D6}</style>
</head>
<body><p>Open Time has moved to <a href="https://opentime.work/">opentime.work</a>.</p></body>
</html>
